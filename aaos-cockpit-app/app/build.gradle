    // On-device detection backend (replaces the dms-ai-engine Python Container Node).
    // Bumped from 0.10.14 to 1.0.0 (2026-08-05): 0.10.14/0.10.21 only ship
    // libmediapipe_tasks_vision_jni.so for arm64-v8a/armeabi-v7a/x86 (32-bit) -- no
    // x86_64 -- which made this pipeline unrunnable on any local x86_64 dev-machine
    // emulator (confirmed UnsatisfiedLinkError, see aaos-cockpit-app/MEMORY.md). 1.0.0
    // moves the native lib into tasks-core (libmediapipe_tasks_jni.so, pulled in
    // transitively) and adds a real x86_64 build. FaceLandmarker's Java API
    // (createFromOptions/Options.Builder/RunningMode.LIVE_STREAM/detectAsync/
    // BitmapImageBuilder) was hand-verified unchanged across this jump -- no source
    // changes needed in FaceLandmarkerClient.kt. This does NOT re-pin to Python's
    // mediapipe==0.10.14 in dms-ai-engine/requirements.txt -- that stays as-is; only
    // this Android/Kotlin-side artifact moved, purely to unblock local emulator testing.
    implementation("com.google.mediapipe:tasks-vision:1.0.0")
    implementation("androidx.camera:camera-core:1.3.1")
    implementation("androidx.camera:camera-camera2:1.3.1")
    implementation("androidx.camera:camera-lifecycle:1.3.1")
    implementation("androidx.camera:camera-view:1.3.1")

